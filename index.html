<!DOCTYPE html>
<html>
<head>
    <title>Budget Planner - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-page">

    <div class="welcome">
        <h1>💰 Budget Planner</h1>
        <p>Manage your budget and expenses easily.</p>
    </div>

    <!-- LOGIN CARD -->
    <div class="card">

        <h2>Login</h2>

        <select id="role" onchange="changeRole()">
            <option value="user">User Login</option>
            <option value="admin">Admin Login</option>
        </select>

        <!-- USER LOGIN -->
        <div id="userLogin">

            <input type="email"
                   id="email"
                   placeholder="Email">

            <input type="tel"
                   id="phone"
                   placeholder="Phone Number">

            <input type="password"
                   id="password"
                   placeholder="Password">

        </div>

        <!-- ADMIN LOGIN -->
        <div id="adminLogin" style="display:none;">

            <input id="adminUsername"
                   placeholder="Admin Username">

            <input type="password"
                   id="adminPassword"
                   placeholder="Admin Password">

        </div>

        <button onclick="login()">Login</button>

        <p class="small">
            New user? Create an account below.
        </p>

    </div>


    <!-- SIGNUP CARD -->
    <div class="card">

        <h2>Create Account</h2>

        <input id="newUser"
               placeholder="Username">

        <input type="email"
               id="newEmail"
               placeholder="Email">

        <input type="tel"
               id="newPhone"
               placeholder="Phone Number">

        <input type="password"
               id="newPass"
               placeholder="Password">

        <button onclick="signup()">Signup</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
