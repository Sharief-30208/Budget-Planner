<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <header>

        <div>
            <h1>⚙️ Admin Dashboard</h1>
            <p>Budget Planner Administration</p>
        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </header>


    <div class="main-grid">

        <!-- ADMIN MODULE -->

        <div class="card">

            <h2>Admin Module</h2>

            <p>
                Admin can monitor registered users
                in the Budget Planner system.
            </p>

            <button onclick="viewUsers()">
                View Registered Users
            </button>

        </div>


        <!-- SYSTEM INFORMATION -->

        <div class="card">

            <h2>System Information</h2>

            <p>Application: Budget Planner</p>
            <p>Technology: HTML, CSS, JavaScript</p>
            <p>Storage: Local Storage</p>

        </div>

    </div>


    <!-- USERS -->

    <div class="card">

        <h2>👥 Registered Users</h2>

        <div id="userList">
            Click the button to view users.
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
