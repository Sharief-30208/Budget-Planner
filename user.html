<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <header>
        <div>
            <h1>💰 Budget Planner</h1>
            <p>Welcome, <span id="username"></span></p>
        </div>

        <button class="logout" onclick="logout()">Logout</button>
    </header>


    <!-- SUMMARY CARDS -->

    <div class="summary">

        <div class="summary-card">
            <h3>Monthly Budget</h3>
            <h2 id="showBudget">₹0</h2>
        </div>

        <div class="summary-card">
            <h3>Total Expenses</h3>
            <h2 id="showExpense">₹0</h2>
        </div>

        <div class="summary-card">
            <h3>Remaining Budget</h3>
            <h2 id="showBalance">₹0</h2>
        </div>

    </div>


    <!-- MAIN GRID -->

    <div class="main-grid">

        <!-- BUDGET -->

        <div class="card">

            <h2>Set Monthly Budget</h2>

            <input type="number"
                   id="budget"
                   placeholder="Enter budget">

            <button onclick="saveBudget()">
                Save Budget
            </button>

        </div>


        <!-- EXPENSE -->

        <div class="card">

            <h2>Add Expense</h2>

            <input id="expense"
                   placeholder="Expense name">

            <input type="number"
                   id="amount"
                   placeholder="Amount">

            <button onclick="addExpense()">
                Add Expense
            </button>

        </div>

    </div>


    <!-- EXPENSE LIST -->

    <div class="card">

        <h2>📋 My Expenses</h2>

        <div id="list">
            No expenses added.
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
